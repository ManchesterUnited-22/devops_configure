apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-our
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: food-our
  template:
    metadata:
      labels:
        app: food-our
    spec:
      containers:
        - name: web
          image: food-our-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: food-our
spec:
  type: NodePort
  selector:
    app: food-our
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081